<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#f5f5f7"/>

  <g transform="translate(128, 72) scale(10.67)">
    <!-- Droplet fill — very light -->
    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"
          fill="#0071e3" fill-opacity="0.1"
          stroke="#0071e3" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- White backing behind gear for contrast -->
    <circle cx="12" cy="14" r="4.5" fill="#f5f5f7" fill-opacity="0.85"/>

    <!-- Gear center circle -->
    <circle cx="12" cy="14" r="2.2" stroke="#0071e3" stroke-width="2" fill="none"/>
    <!-- Gear spokes -->
    <line x1="12" y1="9.2" x2="12" y2="11" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="17" x2="12" y2="18.8" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="8.6" y1="10.6" x2="9.88" y2="11.88" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="14.12" y1="16.12" x2="15.4" y2="17.4" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="7.2" y1="14" x2="9" y2="14" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="14" x2="16.8" y2="14" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="8.6" y1="17.4" x2="9.88" y2="16.12" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
    <line x1="14.12" y1="11.88" x2="15.4" y2="10.6" stroke="#0071e3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="440" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="600" fill="#1d1d1f" letter-spacing="-0.5">
    PixelDrop
  </text>
</svg>
