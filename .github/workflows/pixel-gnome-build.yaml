# To better understand this file read this:
# https://docs.ionos.space/docs/github-actions-customization/

name: "Deploy Now: Execute Build"

on:
  workflow_call:
    inputs:
      site-url:
        required: true
        type: string
      branch-id:
        required: true
        type: string

env:
  DEPLOYMENT_FOLDER: ./dist

jobs:
# Please do not rename this job
  build-project:
    name: build pixel-gnome
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Node assets
        env:
          CI: true
          SITE_URL: ${{ inputs.site-url }}
          # Injected from a GitHub repo variable so the GTM container id stays out
          # of committed source. Empty for forks (they don't inherit this var), so
          # their builds ship with analytics disabled.
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: npm run build

      - name: Verify PDF build contract
        # Fails the deploy if the PDF worker / MuPDF chunk / wasm weren't emitted
        # (the silent regressions we hit twice). See scripts/check-pdf-build.mjs.
        run: node scripts/check-pdf-build.mjs dist

# Please do not touch the following action
      - name: Store deployment content
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 0c11a1b0-30f6-47f9-b2fd-f14df157dfc0
          branch-id: ${{ inputs.branch-id }}
          version: ${{ github.sha }}
          folder: ${{ env.DEPLOYMENT_FOLDER }}
          config-file: .deploy-now/pixel-gnome/config.yaml
          action: upload
