# Build steps can be customized in the pixel-gnome-build.yaml.
# More information under https://docs.ionos.space/docs/github-actions-customization/
# version: 2022-07-21

name: "Deploy Now: Orchestration"
run-name: "Deploy Now: Build pixel-gnome · ${{ github.event.head_commit.message || format('Triggered by {0}', github.triggering_actor) }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  retrieve-project:
    name: check readiness
    # Only run the IONOS deploy chain on the canonical repo. Forks lack the
    # IONOS_API_KEY secret, so without this guard every push to a fork would
    # trigger a failing Actions run.
    if: ${{ github.repository == 'labean365/pixel-gnome' }}
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ fromJson(steps.project.outputs.info).deployment-enabled }}
      branch-id: ${{ fromJson(steps.project.outputs.info).branch-id }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 0c11a1b0-30f6-47f9-b2fd-f14df157dfc0
          action: retrieve-info


  build:
    name: build
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/pixel-gnome-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  deploy:
    name: trigger deployment
    needs:
      - retrieve-project
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment(s)
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 0c11a1b0-30f6-47f9-b2fd-f14df157dfc0
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: dispatch-deployments
